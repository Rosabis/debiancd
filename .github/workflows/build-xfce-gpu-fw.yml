name: build-xfce-gpu-fw

# 组合路线（已简化为单步）：trixie netinst → 只留一块显卡的固件 → 灌入 XFCE → 小体积安装盘
# 目标：把 758 MB 里的 324 MiB 全量固件砍到 8~16 MB（NVIDIA 例外 99 MB），
#       同时去掉图形/Xen initrd（约 160 MiB）与 pool 重复 deb（约 180 MiB）。
on:
  workflow_dispatch:
    inputs:
      gpu:
        description: "只保留哪个厂商的显卡固件"
        type: choice
        options: [amd, intel, nvidia, none]
        default: amd
      dist:
        default: trixie
      extra_pkgs:
        description: "追加包（如 firefox-esr），空格分隔"
        default: ""
      grub_flavors:
        description: "盘里放哪些 grub 引导器（空格分隔；只留一个可再省几 MiB）"
        default: "grub-pc grub-efi-amd64"
      drop_extra_initrd:
        description: "摘掉图形/Xen 安装器 initrd（约 160 MiB，仅文本安装）"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 90
    steps:
      - name: 准备容器
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates curl

      - uses: actions/checkout@v4

      - name: 选择固件包
        run: |
          case "${{ inputs.gpu }}" in
            amd)    FW="firmware-amd-graphics" ;;
            intel)  FW="firmware-intel-graphics firmware-intel-misc" ;;
            nvidia) FW="firmware-nvidia-graphics" ;;
            *)      FW="" ;;
          esac
          echo "FIRMWARE_KEEP=$FW" >> "$GITHUB_ENV"
          echo "选中的固件：$FW"

      - name: 构建 XFCE 小盘
        env:
          DIST: ${{ inputs.dist }}
          AREAS: main
          PROFILE: slim
          INSTALL_RECOMMENDS: "no"
          WORK: work
          OUT: debian-trixie-amd64-xfce-CD-1.iso
          EXTRA_PKGS: ${{ inputs.extra_pkgs }}
          GRUB_FLAVORS: ${{ inputs.grub_flavors }}
          STRIP_FIRMWARE: "1"
          DROP_EXTRA_INITRD: ${{ inputs.drop_extra_initrd && '1' || '0' }}
        run: bash scripts/remaster.sh

      - name: 摘要
        run: |
          {
            echo "### 产物"
            echo '```'
            ls -lh work/debian-trixie-amd64-xfce-CD-1.iso* work/selected-pkgs.txt 2>/dev/null || true
            echo '```'
            echo "gpu=${{ inputs.gpu }} firmware=\`$FIRMWARE_KEEP\` grub=\`${{ inputs.grub_flavors }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: debian-xfce-${{ inputs.gpu }}-${{ inputs.dist }}
          path: |
            work/debian-trixie-amd64-xfce-CD-1.iso
            work/debian-trixie-amd64-xfce-CD-1.iso.sha256
            work/selected-pkgs.txt
          compression-level: 0
          retention-days: 7
